<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz_style.css">
    <script defer src="script/quiz_script.js"></script>
</head>
<body>
    <section id="home" class="hero">
        <div class="main-layout">
            <div class="quiz-side">
                <div class="progress-wrapper">
                    <div id="progress-bar"></div>
                </div>
                <div id="quiz-container"></div>
                <div id="star-anchor"></div>
            </div>

            <div class="sidebar">
                <h3>Progress</h3>
                <div id="question-grid" class="question-grid">
                    </div>
                <div class="stats-mini">
                    <p>Score: <span id="live-points">0</span></p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
