<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz_style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body>
    <div class ="navbar">
        <div class="brand">
            <div class="logo">
                <div class="logo-icon">
                    <img src="assets/logo.png" alt="EmpowerEd Logo">
                </div>
                <div>
                    <h2>EmpowerEd</h2>
                    <p>Think. Learn. Achieve</p>
                </div>
            </div>
        </div>
    

        
        <!-- Accessibility Menu and Profile Button -->
        <div class="nav-controls">
            <div class="accessibility-menu">
                <button class="accessibility-button" ><i class="fa-solid fa-eye" style="margin-right:8px;"></i>Accessibility</button>
                <div id="accessibility-panel" class="accessibility-panel" role="region" aria-label="Accessibility options">
                    <h2>Accessibility Settings</h2>
                    <div class="feature-group" aria-label="Text size">
                        <label>
                            Font Size
                        </label>
                        <div class="button-group">
                            <button type="button" class="text-size-button" data-size="small">Small</button>
                            <button type="button" class="text-size-button active" data-size="medium">Medium</button>
                            <button type="button" class="text-size-button" data-size="large">Large</button>
                        </div>
                    </div>
                    <div class="feature-group" aria-label="Contrast settings">
                        <!-- High Contrast Mode Toggle -->
                        <label>
                            High Contrast Mode
                        </label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="high-contrast-toggle" class="contrast-button" data-contrast="high">
                            <label for="high-contrast-toggle" class="toggle-label"></label>
                        </div>
                        <p class="contrast-description">Enhanced contrast for better visibility</p>
                    </div>
                </div>
            </div>

            <!--Profile-->
            <div class="profile">
          <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
          </div>

          <div>
            <h4>Kyle Bautista</h4>
            <p style="color:#6b7280;font-size:14px;">Student</p>
          </div>
        </div>
        </div>
    </div>

    <div id="back-button-container" class="back-button-container" style="display: none;">
        <a href="ass.html" class="back-button">&laquo; Back</a>
    </div>

    <section id="home" class="hero">
        <div class="main-layout">
            <div class="quiz-side">
                <div class="progress-wrapper">
                    <div id="progress-bar"></div>
                </div>
                <div id="quiz-container"></div>
                <div id="star-anchor"></div>
            </div>

            <div class="sidebar">
                <h3>Questions</h3>
                <div id="question-grid" class="question-grid"></div>

                <div class="stats-mini" style="margin-top: 40px;">
                    Points: <span id="live-points">0</span>
                </div>
                
                <div id="voice-controls-wrapper" class="voice-control-wrapper" style="margin-top: 25px; text-align: center; border-top: 1px solid #e9ecef; padding-top: 20px; word-wrap: break-word;">
                    <button id="mic-toggle" class="mic-btn" onclick="toggleVoice()">🎤</button>
                    <p class="tip" style="font-size: 2rem; color: #555; background: #fff3cd; padding: 10px; border-radius: 8px; margin-top: 10px; line-height: 1.4;">
                        Tip: Say <strong>"Triangle, Circle, Square, or Rectangle"</strong>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 EmpowerED. All rights reserved.</p>
    </footer>

<script src= "script/accessibility-settings.js"></script>
<script src="script/quiz_script.js"></script>

</body>
</html>
